const SB_HEADERS = { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" };

async function sbGet(table, params="") {
  const r = await fetch(`${SB_URL}/${table}?${params}`, { headers: SB_HEADERS });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function sbPost(table, data) {
  const r = await fetch(`${SB_URL}/${table}`, { method: "POST", headers: SB_HEADERS, body: JSON.stringify(data) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
}
async function sbUpsert(table, data, onConflict) {
  const headers = {...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=representation'};
  const r = await fetch(`${SB_URL}/${table}?on_conflict=${onConflict}`, { method: "POST", headers, body: JSON.stringify(data) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function sbDelete(table, params) {
  const r = await fetch(`${SB_URL}/${table}?${params}`, { method: "DELETE", headers: SB_HEADERS });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
}

function isFuture(iso) { return new Date(iso) >= new Date(new Date().toDateString()); }
function initials(n)   { const p=n.split(' '); return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():n[0].toUpperCase(); }

function hcpJuego(jugador, jornada) {
  if (!jornada || !jornada.cr_h) return '—';
  const h = Math.min(jugador.hcp, 36.0);
  const cr    = jugador.sexo === 'M' ? jornada.cr_m    : jornada.cr_h;
  const slope = jugador.sexo === 'M' ? jornada.slope_m : jornada.slope_h;
  return Math.round(h * (slope / 113) + (cr - jornada.par));
}

function lbCerrar() { document.getElementById('lb').classList.remove('on'); document.getElementById('lb-img').src=''; }
function lbMover(d) { if(lbFotos.length<2) return; lbPos = (lbPos + d + lbFotos.length) % lbFotos.length; lbPintar(); }
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key==='Escape') lbCerrar();
  if(e.key==='ArrowLeft') lbMover(-1);
  if(e.key==='ArrowRight') lbMover(1);
});
(function(){ // deslizar con el dedo en el móvil
  let x0 = null;
  const lb = document.getElementById('lb');
  lb.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 50) lbMover(dx<0 ? 1 : -1);
  }, {passive:true});
})();

// ── Subida de fotos (pestaña Administración) ──
const FOTO_LADO = 1600, FOTO_LADO_MINI = 640, FOTO_MAX_BYTES = 1900000, FOTO_MAX_TANDA = 12;

function fotoEventoPorDefecto() {
  const hoy = new Date().toISOString().slice(0,10);
  const pasados = eventosFotos.filter(e=>e.fecha && e.fecha<=hoy);   // eventosFotos viene del más reciente al más antiguo
  return (pasados[0] || eventosFotos[eventosFotos.length-1] || {id:''}).id;
}
function fotoElegir(lista) {
  const nuevas = [...lista].filter(f=>f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  const hueco = FOTO_MAX_TANDA - fotoPend.length;
  if(nuevas.length > hueco) showToast(`Máximo ${FOTO_MAX_TANDA} fotos por tanda`, "warn");
  nuevas.slice(0, Math.max(hueco,0)).forEach(f=>{
    fotoPend.push({ file:f, prev:URL.createObjectURL(f), pie:'', estado:'pendiente', msg:'' });
  });
  render();
}
function fotoQuitar(i) {
  if(fotoSubiendo || !fotoPend[i]) return;
  URL.revokeObjectURL(fotoPend[i].prev);
  fotoPend.splice(i,1);
  render();
}
function fotoCargarImagen(file) {
  return new Promise((ok, mal)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = ()=>{ URL.revokeObjectURL(url); ok(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); mal(new Error('FORMATO')); };
    img.src = url;
  });
}
function fotoLienzo(origen, anchoO, altoO, lado) {
  const k = Math.min(1, lado / Math.max(anchoO, altoO));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(anchoO*k)); c.height = Math.max(1, Math.round(altoO*k));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(origen, 0, 0, c.width, c.height);
  return c;
}
function fotoBlob(lienzo, calidad) {
  return new Promise((ok, mal)=> lienzo.toBlob(b=> b ? ok(b) : mal(new Error('FORMATO')), 'image/jpeg', calidad));
}
// Devuelve la foto reducida para la web y su miniatura, ambas en JPEG
async function fotoReducir(file) {
  const img = await fotoCargarImagen(file);
  const grandeC = fotoLienzo(img, img.naturalWidth, img.naturalHeight, FOTO_LADO);
  let grande = await fotoBlob(grandeC, 0.82);
  if(grande.size > FOTO_MAX_BYTES) grande = await fotoBlob(grandeC, 0.65);
  if(grande.size > FOTO_MAX_BYTES) throw new Error('PESO');
  const miniC = fotoLienzo(grandeC, grandeC.width, grandeC.height, FOTO_LADO_MINI);
  const mini = await fotoBlob(miniC, 0.72);
  return { grande, mini };
}
function fotoSello(n) {
  const d = new Date(), p = v=>String(v).padStart(2,'0');
  const azar = Math.random().toString(36).slice(2,6);
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${n}${azar}`;
}
function fotoErrorLegible(e) {
  const m = String(e && e.message || e);
  if(m==='FORMATO') return 'Formato no compatible con este navegador. Guárdala como JPG y vuelve a intentarlo.';
  if(m==='PESO' || m.startsWith('413')) return 'La foto pesa demasiado incluso reducida.';
  if(m.startsWith('Failed to fetch') || m.startsWith('NetworkError') || m.startsWith('Load failed')) return 'Sin conexión. Vuelve a intentarlo.';
  return 'No se ha podido publicar (' + m.slice(0,120) + ')';
}
async function fotoPublicar() {
  if(fotoSubiendo) return;
  const ev = eventoFotosPorId(fotoEvento);
  if(!ev) { showToast("Elige el evento", "warn"); return; }
  const pend = fotoPend.filter(p=>p.estado!=='ok');
  if(!pend.length) { showToast("Elige primero las fotos", "warn"); return; }
  fotoSubiendo = true;
  let orden = ev.fotos.reduce((m,f)=>Math.max(m, f.orden||0), 0);
  let bien = 0, n = 0;
  for(const p of pend) {
    n++;
    try {
      p.estado = 'proc'; p.msg = 'Preparando…'; render();
      const { grande, mini } = await fotoReducir(p.file);
      const base = `${ev.anio}/${ev.id}/${fotoSello(n)}`;
      p.msg = 'Subiendo…'; render();
      await sbSubirFoto(`${base}.jpg`, grande);
      await sbSubirFoto(`${base}_mini.jpg`, mini);
      await sbPost("fotos", { evento_id: ev.id, ruta: `${base}.jpg`, ruta_mini: `${base}_mini.jpg`,
                              pie: p.pie.trim().slice(0,200) || null, orden: orden+1 });
      orden++; bien++;
      p.estado = 'ok'; p.msg = 'Publicada ✓';
    } catch(e) {
      p.estado = 'error'; p.msg = fotoErrorLegible(e);
    }
    render();
  }
  fotoSubiendo = false;
  fotoPend.filter(p=>p.estado==='ok').forEach(p=>URL.revokeObjectURL(p.prev));
  fotoPend = fotoPend.filter(p=>p.estado!=='ok');
  const mal = pend.length - bien;
  showToast(mal ? `${bien} publicada${bien!==1?'s':''}, ${mal} con error` : `${bien} foto${bien!==1?'s':''} publicada${bien!==1?'s':''} ✓`, mal ? "warn" : "ok");
  await cargarFotos();
}

      </div>
      <button class="foto-quitar" onclick="fotoQuitar(${i})" aria-label="Quitar" ${bloqueo}>✕</button>
    </div>`;
  });
  const quedan = fotoPend.filter(p=>p.estado!=='ok').length;
  h += `<div class="foto-botones">
      <button class="adm-btn adm-btn-excel" onclick="document.getElementById('foto-input').click()" ${bloqueo}>➕ Elegir fotos</button>

      Para retirar una foto ya publicada, pídeselo a Teebot.</div>
  </div></div>`;
  return h;
}

// CLASIFICACIÓN
// ═══════════════════════════════════════════════
function calcClasificacion(tipo) {
  const por={};
  JUGADORES.forEach(j=>{ por[j.nombre]=[]; });
  JORNADAS.forEach(jor=>{
    resultados.filter(r=>r.jornada===jor.id && r[tipo]!=null)
      .forEach(r=>{ if(por[r.jugador]) por[r.jugador].push(r[tipo]); });
  });
  const top4=arr=>[...arr].sort((a,b)=>b-a).slice(0,4).reduce((s,v)=>s+v,0);
  return JUGADORES
    .map(j=>({nombre:j.nombre,hcp:j.hcp,sexo:j.sexo,total:top4(por[j.nombre]),jornadas:por[j.nombre].length}))
    .filter(j=>j.jornadas>0)
    .sort((a,b)=>b.total!==a.total?b.total-a.total:tipo==="stableford"?a.hcp-b.hcp:b.hcp-a.hcp);
}

function calcClausura(tipo) {
  const ids = CLAUSURA.map(c=>c.id);
  return JUGADORES.map(j=>{
    const p = {};
    ids.forEach(id=>{
      const r = resultados.find(x=>x.jugador===j.nombre && x.jornada===id && x[tipo]!=null);
      if(r) p[id] = r[tipo];
    });
    const jugadas = Object.keys(p).length;
    const total = Object.values(p).reduce((s,v)=>s+v,0);
    return { nombre:j.nombre, hcp:j.hcp, sexo:j.sexo, parciales:p, jugadas, total };
  })
  .filter(j=>j.jugadas>0)
  .sort((a,b)=> b.total!==a.total ? b.total-a.total
              : tipo==="stableford" ? a.hcp-b.hcp : b.hcp-a.hcp);
}

function resultadosJornada(jid, tipo) {
  return [...resultados.filter(r=>r.jornada===jid && r[tipo]!=null)]
    .sort((a,b)=>{
      if(b[tipo]!==a[tipo]) return b[tipo]-a[tipo];
      const ja=JUGADORES.find(j=>j.nombre===a.jugador);
      const jb=JUGADORES.find(j=>j.nombre===b.jugador);
      if(!ja||!jb) return 0;
      return tipo==="stableford"?ja.hcp-jb.hcp:jb.hcp-ja.hcp;
    });
}

// EXPORTAR BACKUP COMPLETO (todas las jornadas + resultados)
// ═══════════════════════════════════════════════
function exportarBackupCompleto() {
  if(inscripciones.length===0 && resultados.length===0){
    showToast("No hay datos que exportar","warn"); return;
  }
  const wb=XLSX.utils.book_new();

  // Hoja 1: Inscripciones (todas las jornadas)
  const datosInsc = inscripciones.map(i=>({
    'Jornada': i.jornada, 'Jugador': i.jugador
  })).sort((a,b)=> a.Jornada.localeCompare(b.Jornada) || a.Jugador.localeCompare(b.Jugador,'es'));
  const wsInsc=XLSX.utils.json_to_sheet(datosInsc);
  wsInsc['!cols']=[{wch:10},{wch:32}];
  XLSX.utils.book_append_sheet(wb,wsInsc,"Inscripciones");

  // Hoja 2: Resultados (todas las jornadas)
  const datosRes = resultados.map(r=>({
    'Jornada': r.jornada, 'Jugador': r.jugador,
    'Stableford': r.stableford, 'Scratch': r.scratch
  })).sort((a,b)=> a.Jornada.localeCompare(b.Jornada) || a.Jugador.localeCompare(b.Jugador,'es'));
  const wsRes=XLSX.utils.json_to_sheet(datosRes);
  wsRes['!cols']=[{wch:10},{wch:32},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,wsRes,"Resultados");

  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`Backup_Campeonato_${fecha}.xlsx`);
  showToast("Backup completo descargado ✓");
}

function exportarExcel(jid) {
  const jornada=JORNADAS.find(j=>j.id===jid);
  const lista=inscritos(jid);
  if(lista.length===0){ showToast("Sin inscritos en "+jid,"warn"); return; }
  const datos=lista.map((j,i)=>({
    'Nº': i+1, 'Nombre': j.nombre, 'Licencia': j.licencia||'—',
    'HCP Exacto': (jornada && jornada.cr_h) ? Math.min(j.hcp,36).toFixed(1) : '—',
    'HCP Juego': hcpJuego(j, jornada), 'Tees': j.sexo==='M'?'Rojas':'Amarillas',
  }));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(datos);
  ws['!cols']=[{wch:4},{wch:28},{wch:14},{wch:12},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,"Inscritos");
  XLSX.writeFile(wb,`Inscritos_${jid}_${jornada.campo.replace(/ /g,'_')}.xlsx`);
  showToast("Excel descargado ✓");
}

function estaPagado(nombre) {
  const c = cuotas.find(x=>x.jugador===nombre);
  return c ? !!c.pagado : false;
}

async function toggleCuota(nombre, checkbox) {
  const nuevoEstado = checkbox.checked;
  checkbox.disabled = true;
  try {
    await sbUpsert("cuotas", [{ jugador: nombre, pagado: nuevoEstado, actualizado_en: new Date().toISOString() }], "jugador");
    const c = cuotas.find(x=>x.jugador===nombre);
    if(c) c.pagado = nuevoEstado; else cuotas.push({jugador:nombre, pagado:nuevoEstado});
    showToast(nuevoEstado ? `${nombre}: cuota marcada como pagada ✓` : `${nombre}: cuota marcada como pendiente`);
    render();
  } catch(e) {
    showToast("Error al actualizar: " + e.message, "warn");
    checkbox.checked = !nuevoEstado;
  } finally {
    checkbox.disabled = false;
  }
}

    } else {
      const jornada=JORNADAS.find(j=>j.id===resVista);
      const lista=resultadosJornada(resVista,resTipo);
      html+=tiraFotosHTML(eventoFotosDeJornada(resVista));
      html+=`<div class="card"><div class="card-header">
        <div class="card-title">${jornada?.id} · ${jornada?.campo} — ${resTipo==="stableford"?"Stableford Hándicap":"Stableford Scratch"}</div>
        <div class="card-sub">${jornada?.fecha}</div></div>`;
      if(lista.length===0) {
        html+=`<div class="empty-state" style="padding:32px 20px;">Sin datos para esta modalidad</div>`;
      } else {
        lista.forEach((r,idx)=>{
          const yo=r.jugador===jugadorActual;
          const jug=JUGADORES.find(j=>j.nombre===r.jugador);
          html+=`<div class="result-row${yo?' yo':''}">
            <div class="pos${idx<3?' medal':''}">${idx<3?MEDALS[idx]:idx+1}</div>
            ${avatarHTML(r.jugador,jug?.sexo||'H',false)}
            <div style="flex:1"><div class="result-name${yo?' yo':''}">${r.jugador}</div>
            <div class="result-hcp">HCP ${jug?Math.min(jug.hcp,36).toFixed(1):'—'}</div></div>
            <div class="result-pts${idx===0?' winner':''}">${r[resTipo]}</div>
          </div>`;
        });
      }
      html+=`</div>`;
    }
    c.innerHTML=html;

// ── HÁNDICAPS ────────────────────────────────
  } else if(tabActual==="handicaps") {
    const sorted=[...JUGADORES].sort((a,b)=>a.hcp-b.hcp);
    let html=`<div class="card" style="overflow:hidden;">
      <div class="card-header">
        <div class="card-title">Hándicaps</div>
        <div class="card-sub">Media 8 mejores SD · últimas 20 rondas (sin factor 0.96)</div>
      </div>
      <table><thead><tr>
        <th class="center" style="width:36px;">Cuota</th><th>Jugador</th><th class="center">HCP</th><th class="center">Tees</th>
      </tr></thead><tbody>`;
    sorted.forEach(j=>{
      const yo=j.nombre===jugadorActual;
      const hcpCls=j.hcp<=15?"hcp-low":j.hcp<=25?"hcp-mid":"hcp-high";
      const pagado=estaPagado(j.nombre);
      html+=`<tr class="${yo?'highlight':''}">
        <td class="center" title="${pagado?'Cuota pagada':'Cuota pendiente'}">${pagado?'<span style="color:#16A34A;font-size:16px;">✓</span>':'<span style="color:#ddd;font-size:16px;">—</span>'}</td>
        <td><div class="td-player">${avatarHTML(j.nombre,j.sexo,false)}<span style="font-size:12px;font-weight:${yo?700:400}">${j.nombre}</span></div></td>
        <td class="center"><span class="hcp-value ${hcpCls}">${Math.min(j.hcp,36).toFixed(1)}</span></td>
        <td class="center"><span class="tees-pill ${j.sexo==='M'?'tees-m':'tees-h'}">${j.sexo==='M'?'Rojas':'Amarillas'}</span></td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
    c.innerHTML=html;

  // ── CALENDARIO ───────────────────────────────
  } else if(tabActual==="calendario") {
    let html='';
    JORNADAS.forEach(j=>{
      const total=inscritos(j.id).length;
      const pasada=!isFuture(j.iso);
      const ap=jugadorActual&&estaApuntado(jugadorActual,j.id);
      const tieneRes=resultados.some(r=>r.jornada===j.id);
      const pct=Math.round((total/18)*100);
      const fill=total>=10?"#1B4332":total>=5?"#92400E":"#D1FAE5";
      html+=`<div class="cal-card${ap?' apuntado':tieneRes?' tiene-result':''}${pasada?' pasada':''}">
        <div class="cal-row">
          <div class="cal-left">
            <div class="cal-id">${j.id}</div>
            <div><div class="cal-campo">${j.campo}</div>
            <div class="cal-fecha">${j.fecha}${tieneRes?'<span class="meta-result"> · Resultados ✓</span>':''}</div></div>
          </div>
          <div style="text-align:right">
            <div class="cal-count${total>0?' has':''}">${total}</div>
            <div class="cal-label">inscritos</div>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${fill}"></div></div>
        ${ap?`<div class="ya-apuntado">✓ Estás apuntado</div>`:''}
      </div>`;
    });
    html+=`<div style="padding:10px 0;font-size:11px;color:#ccc;text-align:center;">Barra: nivel de inscripción sobre 18 jugadores</div>`;
    c.innerHTML=html;

  // ── FOTOS ────────────────────────────────────
  } else if(tabActual==="fotos") {
    let html='';
    const conFotos=eventosFotos.filter(e=>e.fotos.length>0);
    if(fotosEstado==="cargando") {
      html+=`<div class="loading"><span class="spinner"></span>Cargando fotos...</div>`;
    } else if(fotosEstado==="error") {
      html+=`<div class="card"><div class="empty-state"><div style="font-size:32px;margin-bottom:8px">📷</div>
        <div style="font-size:14px;font-weight:600;">No se han podido cargar las fotos</div>
        <div style="font-size:12px;margin-top:8px;"><a style="color:#1B4332;font-weight:600;cursor:pointer;" onclick="fotosEstado='cargando';render();cargarFotos()">Reintentar</a></div></div></div>`;
    } else if(conFotos.length===0) {
      html+=`<div class="card"><div class="empty-state"><div style="font-size:32px;margin-bottom:8px">📷</div>
        <div style="font-size:14px;font-weight:600;">Aún no hay fotos de esta temporada</div>
        <div style="font-size:12px;margin-top:4px;">Aparecerán aquí tras cada jornada</div></div></div>`;
    } else {
      conFotos.forEach(ev=>{
        html+=`<div class="foto-ev"><div class="foto-ev-cab">
          <div><div class="foto-ev-nom">${esc(ev.nombre)}</div>${ev.meta?`<div class="foto-ev-meta">${esc(ev.meta)}</div>`:''}</div>
          <div class="foto-ev-num">${ev.fotos.length} foto${ev.fotos.length!==1?'s':''}</div>
        </div><div class="foto-ev-grid">`;
        ev.fotos.forEach((f,i)=>{
          html+=`<img loading="lazy" src="${esc(fotoURL(f,true))}" alt="${esc(f.pie||ev.nombre)}" onclick="lbAbrir('${esc(ev.id)}',${i})"/>`;
        });
        html+=`</div></div>`;
      });
    }
    html+=`<a class="fotos-enlace" href="${GALERIA_URL}" target="_blank" rel="noopener">Galería histórica del club ›</a>`;
    c.innerHTML=html;

  // ── ADMINISTRACIÓN ───────────────────────────
  } else if(tabActual==="administracion") {
    if(!admAuth) {
      c.innerHTML=`<div class="adm-login">
        <div class="card" style="padding:32px;text-align:center;">
          <div style="font-size:28px;margin-bottom:12px;">🔒</div>
          <h2 style="font-size:16px;font-weight:700;color:#1B4332;margin-bottom:6px;">Zona de Administración</h2>
          <p style="font-size:12px;color:#aaa;margin-bottom:20px;">Acceso restringido al director de torneo</p>
          <input type="password" id="adm-pwd" placeholder="Contraseña" onkeydown="if(event.key==='Enter')admLogin()"/>
          <button id="adm-login-btn" onclick="admLogin()">Entrar</button>
          <div id="adm-error" style="color:#DC2626;font-size:12px;margin-top:8px;display:none;">Contraseña incorrecta</div>
        </div>
      </div>`;
      return;
    }
    let html=`<div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:13px;font-weight:700;color:#1B4332;margin-bottom:4px;">📋 Administración — Gestión por Jornada</div>
        <div style="font-size:11px;color:#aaa;">Listado de inscritos · Exportar Excel</div>
      </div>
      <button class="adm-btn adm-btn-excel" onclick="exportarBackupCompleto()" style="background:#1B4332;color:#fff;border-color:#1B4332;">
        💾 Exportar TODO (backup)
      </button>
    </div>`;

    // ── Subida de fotos ──
    html+=fotoFormHTML();

    // ── Gestión de cuotas anuales ──
    const sortedCuotas=[...JUGADORES].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    const numPagados=sortedCuotas.filter(j=>estaPagado(j.nombre)).length;
    html+=`<div class="adm-jornada" style="margin-bottom:20px;">
      <div class="adm-jornada-hdr">
        <div>
          <div class="adm-jornada-title">💳 Cuota anual</div>
          <div class="adm-jornada-meta">Marca quién ha pagado la cuota del club</div>
        </div>
        <div class="adm-badge">${numPagados} / ${sortedCuotas.length} pagados</div>
      </div>
      <table class="adm-table"><thead><tr>
        <th>Jugador</th><th class="center" style="width:70px;">Pagado</th>
      </tr></thead><tbody>`;
    sortedCuotas.forEach(j=>{
      const pagado=estaPagado(j.nombre);
      const safeName=j.nombre.replace(/'/g,"\\'");
      html+=`<tr>
        <td style="font-weight:500;">${j.nombre}</td>
        <td class="center"><input type="checkbox" ${pagado?'checked':''} onchange="toggleCuota('${safeName}', this)" style="width:18px;height:18px;cursor:pointer;accent-color:#16A34A;"/></td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;

    // ── Otros eventos de la temporada (Ryder Cup, Clausura) ──
    EVENTOS.forEach(ev=>{
      const lista=inscritosEvento(ev.id);
      html+=`<div class="adm-jornada" style="margin-bottom:20px;">
        <div class="adm-jornada-hdr">
          <div>
            <div class="adm-jornada-title">${ev.id==='ryder'?'🏆':'🎉'} ${ev.nombre}</div>
            <div class="adm-jornada-meta">${ev.fecha} · ${ev.sede}</div>
          </div>
          <div class="adm-badge">${lista.length} apuntado${lista.length!==1?'s':''}</div>
        </div>`;
      if(lista.length===0) {
        html+=`<div class="adm-empty">Sin inscritos</div>`;
      } else {
        html+=`<table class="adm-table"><thead><tr>
          <th>#</th><th>Jugador</th>${ev.comentario?'<th>Comentario</th>':''}
        </tr></thead><tbody>`;
        lista.forEach((jug,idx)=>{
          const com=comentarioEvento(jug.nombre,ev.id);
          html+=`<tr>
            <td style="color:#aaa;font-size:11px;">${idx+1}</td>
            <td style="font-weight:500;">${jug.nombre}</td>
            ${ev.comentario?`<td style="font-size:12px;color:#666;">${com||'—'}</td>`:''}
          </tr>`;
        });
        html+=`</tbody></table>`;
      }
      html+=`</div>`;
    });

    JORNADAS.forEach(j=>{
      const lista=inscritos(j.id).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')); const jornadaData=j;
      const pasada=!isFuture(j.iso);
      const hombres=lista.filter(x=>x.sexo==='H').length;
      const mujeres=lista.filter(x=>x.sexo==='M').length;
      html+=`<div class="adm-jornada">
        <div class="adm-jornada-hdr">
          <div>
            <div class="adm-jornada-title">${j.id} · ${j.campo}</div>
            <div class="adm-jornada-meta">${j.fecha}${pasada?' · Jugada':''}</div>
          </div>
          <div class="adm-badge">${lista.length} jugador${lista.length!==1?'es':''}</div>
        </div>`;
      if(lista.length===0) {
        html+=`<div class="adm-empty">Sin inscritos</div>`;
      } else {
        html+=`<table class="adm-table"><thead><tr>
          <th>#</th><th>Jugador</th><th>Licencia</th><th>HCP Exacto</th><th>HCP Juego</th><th>Tees</th>
        </tr></thead><tbody>`;
        lista.forEach((jug,idx)=>{
          html+=`<tr>
            <td style="color:#aaa;font-size:11px;">${idx+1}</td>
            <td style="font-weight:500;">${jug.nombre}</td>
            <td style="font-size:11px;color:#666;">${jug.licencia||'—'}</td>
            <td><span class="adm-hcp">${jornadaData && jornadaData.cr_h ? Math.min(jug.hcp,36).toFixed(1) : '—'}</span></td>
            <td><span class="adm-hcp">${hcpJuego(jug, jornadaData)}</span></td>
            <td style="font-size:11px;font-weight:600;color:${jug.sexo==='M'?'#1D4ED8':'#92400E'}">${jug.sexo==='M'?'🔴 Rojas':'🟡 Amarillas'}</td>
          </tr>`;
        });
        html+=`</tbody></table>
        <div class="adm-summary">
          <div><span class="adm-sum-num">${lista.length}</span><span class="adm-sum-lbl">Total</span></div>
          <div><span class="adm-sum-num">${hombres}</span><span class="adm-sum-lbl">Hombres</span></div>
          <div><span class="adm-sum-num">${mujeres}</span><span class="adm-sum-lbl">Mujeres</span></div>
        </div>`;
      }
      html+=`<div class="adm-actions">
        <button class="adm-btn adm-btn-excel" onclick="exportarExcel('${j.id}')"
          ${lista.length===0?'disabled style="opacity:0.4;cursor:not-allowed;"':''}>
          📥 Exportar Excel
        </button>
      </div></div>`;
    });
    c.innerHTML=html;
  }
}

// Arrancar
cargarDatos();

// Refresco automático de inscripciones cada 30 segundos
// para que todos los usuarios vean altas y bajas en tiempo real
let repintarPendiente = false;
setInterval(async () => {
  try {
    const [nuevas, nuevasEventos] = await Promise.all([
      sbGet("inscripciones", "select=jugador,jornada"),
      sbGet("inscripciones_eventos", "select=jugador,evento,comentario")
    ]);
    // Solo se repinta si algo ha cambiado: así no parpadean las fotos ni se pierde lo que se esté escribiendo
    const hayCambios = JSON.stringify(nuevas)!==JSON.stringify(inscripciones)
                    || JSON.stringify(nuevasEventos)!==JSON.stringify(inscripcionesEventos);
    inscripciones = nuevas;
    inscripcionesEventos = nuevasEventos;
    const escribiendo = document.activeElement && document.activeElement.tagName==='INPUT'
                     && ['text','password'].includes(document.activeElement.type);
    if(hayCambios) repintarPendiente = true;
    if(repintarPendiente && !fotoSubiendo && !escribiendo) { repintarPendiente = false; render(); }
  } catch(e) {
    // Silencioso — no interrumpir al usuario si falla el refresco
  }
}, 30000);
</script>
</body>
</html>
